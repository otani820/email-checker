<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メール丁寧度チェッカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2b39;
    --ink-soft:#44546a;
    --paper:#e9e6dc;
    --paper-line:#d3cfc0;
    --card:#f6f4ee;
    --seal:#b23a2e;
    --seal-dark:#8a2c22;
    --good:#54704f;
    --warn:#a06a2e;
    --muted:#8b8478;
    --border:#c9c4b3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(28,43,57,0.025) 0px, rgba(28,43,57,0.025) 1px, transparent 1px, transparent 34px);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    padding:40px 24px 80px;
  }
  .wrap{max-width:1040px;margin:0 auto;}

  /* Header */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:24px;
    border-bottom:2px solid var(--ink);
    padding-bottom:20px;
    margin-bottom:36px;
    flex-wrap:wrap;
  }
  .title-block .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--seal);
    font-weight:600;
    margin-bottom:8px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(28px, 4vw, 40px);
    margin:0 0 6px;
    letter-spacing:0.02em;
  }
  .subtitle{color:var(--ink-soft);font-size:14px;margin:0;}
  .stamp-mini{width:64px;height:64px;flex-shrink:0;}

  /* Layout */
  .grid{
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:28px;
  }
  @media (max-width:820px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:2px;
    padding:24px;
    position:relative;
  }
  .panel::before{
    content:'';
    position:absolute;
    top:10px;left:10px;right:10px;bottom:10px;
    border:1px solid rgba(28,43,57,0.08);
    pointer-events:none;
  }
  .panel-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--muted);
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
  }

  textarea{
    width:100%;
    min-height:280px;
    resize:vertical;
    border:none;
    background:
      repeating-linear-gradient(0deg, transparent 0, transparent 31px, var(--paper-line) 31px, var(--paper-line) 32px);
    line-height:32px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15px;
    color:var(--ink);
    padding:0 4px;
    outline:none;
  }
  textarea::placeholder{color:#a19c8c;}

  .row-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:16px;
    gap:12px;
    flex-wrap:wrap;
  }
  .char-count{font-family:'JetBrains Mono', monospace;font-size:12px;color:var(--muted);}

  button{font-family:inherit;cursor:pointer;border:none;}
  .btn-sample{
    background:none;
    color:var(--ink-soft);
    font-size:13px;
    text-decoration:underline;
    text-underline-offset:3px;
    padding:6px 2px;
  }
  .btn-sample:hover{color:var(--seal);}

  .btn-check{
    background:var(--ink);
    color:var(--card);
    font-size:14px;
    font-weight:700;
    padding:13px 26px;
    border-radius:2px;
    letter-spacing:0.04em;
    transition:background 0.15s ease, transform 0.1s ease;
  }
  .btn-check:hover{background:var(--seal-dark);}
  .btn-check:active{transform:scale(0.98);}
  .btn-check:disabled{opacity:0.5;cursor:default;}

  /* Result panel states */
  .result-empty{
    min-height:340px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    gap:18px;
    text-align:center;
  }
  .result-empty p{font-size:13px;margin:0;max-width:220px;line-height:1.7;}
  .stamp-outline{
    width:110px;height:110px;
    border:2px dashed #b7b09c;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho', serif;
    font-size:13px;
    color:#b7b09c;
  }

  .loading{
    min-height:340px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
  }
  .stamp-drop{
    width:110px;height:110px;
    animation:drop 0.9s ease-in-out infinite;
  }
  @keyframes drop{
    0%,100%{transform:translateY(-14px) rotate(-3deg);opacity:0.6;}
    50%{transform:translateY(2px) rotate(2deg);opacity:1;}
  }
  .loading-text{font-family:'JetBrains Mono', monospace;font-size:12px;color:var(--muted);letter-spacing:0.06em;}

  .result-body{display:none;}
  .result-body.show{display:block;}

  .verdict-row{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:22px;
    padding-bottom:22px;
    border-bottom:1px solid var(--border);
  }
  .stamp-seal{
    width:100px;height:100px;flex-shrink:0;
    animation:stampDown 0.5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes stampDown{
    0%{transform:scale(1.9) rotate(-8deg);opacity:0;}
    60%{transform:scale(0.95) rotate(2deg);opacity:1;}
    100%{transform:scale(1) rotate(0deg);opacity:1;}
  }
  .verdict-meta{flex:1;}
  .score-num{
    font-family:'JetBrains Mono', monospace;
    font-size:34px;
    font-weight:700;
    line-height:1;
    margin-bottom:4px;
  }
  .score-label{font-size:12px;color:var(--muted);font-family:'JetBrains Mono', monospace;letter-spacing:0.05em;}
  .verdict-summary{font-size:13.5px;color:var(--ink-soft);margin-top:10px;line-height:1.7;}

  .section-title{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--muted);
    margin:0 0 12px;
    text-transform:uppercase;
  }

  .flags{list-style:none;padding:0;margin:0 0 24px;display:flex;flex-direction:column;gap:10px;}
  .flag{
    border-left:3px solid var(--seal);
    background:rgba(178,58,46,0.05);
    padding:10px 14px;
    border-radius:0 2px 2px 0;
  }
  .flag.type-stiff{border-left-color:var(--warn);background:rgba(160,106,46,0.06);}
  .flag-phrase{font-weight:700;font-size:13.5px;margin-bottom:3px;}
  .flag-note{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
  .flag-suggestion{font-size:12.5px;color:var(--good);margin-top:4px;}
  .flag-suggestion b{font-weight:700;}

  .improved-box{
    background:#fff;
    border:1px solid var(--border);
    padding:16px;
    font-size:13.5px;
    line-height:1.9;
    white-space:pre-wrap;
    border-radius:2px;
    max-height:260px;
    overflow-y:auto;
  }
  .copy-btn{
    margin-top:10px;
    background:none;
    border:1px solid var(--ink);
    color:var(--ink);
    font-size:12px;
    padding:8px 16px;
    border-radius:2px;
    letter-spacing:0.03em;
  }
  .copy-btn:hover{background:var(--ink);color:var(--card);}

  .error-box{
    color:var(--seal);
    font-size:13px;
    padding:14px;
    border:1px solid var(--seal);
    border-radius:2px;
    background:rgba(178,58,46,0.06);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <div class="eyebrow">BUSINESS TOOL — 01</div>
      <h1>メール丁寧度チェッカー</h1>
      <p class="subtitle">送る前に、ひと押し。文面の丁寧さをハンコで判定します。</p>
    </div>
    <svg class="stamp-mini" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" fill="none" stroke="var(--seal)" stroke-width="4"/>
      <text x="50" y="42" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="20" fill="var(--seal)" font-weight="700">検</text>
      <text x="50" y="66" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="20" fill="var(--seal)" font-weight="700">閲</text>
    </svg>
  </header>

  <div class="grid">

    <!-- INPUT PANEL -->
    <div class="panel">
      <div class="panel-label"><span>INPUT — 送信前のメール</span><span id="charCount">0字</span></div>
      <textarea id="emailInput" placeholder="ここにメール本文を貼り付けてください。&#10;&#10;例）お疲れ様です。先ほどの件ですが、〆切に間に合いそうにないので延ばしてもらえますか。"></textarea>
      <div class="row-actions">
        <button class="btn-sample" id="sampleBtn">サンプル文を試す</button>
        <button class="btn-check" id="checkBtn">押印してチェックする</button>
      </div>
    </div>

    <!-- RESULT PANEL -->
    <div class="panel">
      <div class="panel-label"><span>RESULT — 判定</span><span id="resultTag"></span></div>

      <div class="result-empty" id="stateEmpty">
        <div class="stamp-outline">未検査</div>
        <p>左に文章を貼り付けて「押印してチェックする」を押すと、ここに丁寧度の判定が表示されます。</p>
      </div>

      <div class="loading" id="stateLoading" style="display:none;">
        <svg class="stamp-drop" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" fill="none" stroke="var(--seal)" stroke-width="4"/>
          <text x="50" y="58" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="18" fill="var(--seal)" font-weight="700">検査中</text>
        </svg>
        <div class="loading-text">TEXT ANALYZING...</div>
      </div>

      <div class="result-body" id="stateResult">
        <div class="verdict-row">
          <svg class="stamp-seal" id="sealSvg" viewBox="0 0 100 100"></svg>
          <div class="verdict-meta">
            <div class="score-num" id="scoreNum">--</div>
            <div class="score-label">POLITENESS SCORE / 100</div>
            <div class="verdict-summary" id="verdictSummary"></div>
          </div>
        </div>

        <div id="flagsSection">
          <p class="section-title">気になった箇所</p>
          <ul class="flags" id="flagsList"></ul>
        </div>

        <div>
          <p class="section-title">言い換え案（全文）</p>
          <div class="improved-box" id="improvedBox"></div>
          <button class="copy-btn" id="copyBtn">コピーする</button>
        </div>
      </div>

      <div class="error-box" id="errorBox" style="display:none;"></div>
    </div>

  </div>
</div>

<script>
const emailInput = document.getElementById('emailInput');
const charCount = document.getElementById('charCount');
const checkBtn = document.getElementById('checkBtn');
const sampleBtn = document.getElementById('sampleBtn');
const stateEmpty = document.getElementById('stateEmpty');
const stateLoading = document.getElementById('stateLoading');
const stateResult = document.getElementById('stateResult');
const errorBox = document.getElementById('errorBox');
const resultTag = document.getElementById('resultTag');

const SAMPLE = "お疲れ様です。先ほど話してた資料の件だけど、今日中は無理そうなので明日の朝イチでいい？あと会議の時間も変えたいんだけどOK？";

emailInput.addEventListener('input', () => {
  charCount.textContent = emailInput.value.length + '字';
});

sampleBtn.addEventListener('click', () => {
  emailInput.value = SAMPLE;
  charCount.textContent = SAMPLE.length + '字';
});

function setState(state){
  stateEmpty.style.display = state === 'empty' ? 'flex' : 'none';
  stateLoading.style.display = state === 'loading' ? 'flex' : 'none';
  stateResult.classList.toggle('show', state === 'result');
  errorBox.style.display = state === 'error' ? 'block' : 'none';
}

function sealColor(score){
  if(score >= 70) return {main:'var(--good)', dark:'#3f5a3c'};
  if(score >= 40) return {main:'var(--warn)', dark:'#7c5222'};
  return {main:'var(--seal)', dark:'#8a2c22'};
}

function renderSeal(verdictShort, score){
  const c = sealColor(score);
  const chars = verdictShort.length === 2 ? [verdictShort[0], verdictShort[1]] : [verdictShort.slice(0,2), verdictShort.slice(2,4) || ''];
  document.getElementById('sealSvg').innerHTML = `
    <defs>
      <filter id="rough">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2"/>
      </filter>
    </defs>
    <g filter="url(#rough)">
      <circle cx="50" cy="50" r="42" fill="none" stroke="${c.main}" stroke-width="5"/>
      <text x="50" y="43" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="22" fill="${c.main}" font-weight="800">${chars[0]}</text>
      <text x="50" y="68" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="22" fill="${c.main}" font-weight="800">${chars[1]}</text>
    </g>`;
  document.getElementById('scoreNum').style.color = c.main;
}

async function analyzeEmail(text){
  // APIキーはブラウザ側には置かず、Netlify Function経由でサーバー側から呼び出す
  const response = await fetch("/.netlify/functions/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text })
  });

  if(!response.ok){
    const errBody = await response.text();
    throw new Error("APIリクエストに失敗しました: " + errBody);
  }

  return await response.json();
}

checkBtn.addEventListener('click', async () => {
  const text = emailInput.value.trim();
  if(!text){
    emailInput.focus();
    return;
  }
  checkBtn.disabled = true;
  resultTag.textContent = '';
  setState('loading');

  try{
    const result = await analyzeEmail(text);

    renderSeal(result.verdict_short || '判定', result.score ?? 50);
    document.getElementById('scoreNum').textContent = result.score ?? '--';
    document.getElementById('verdictSummary').textContent =
      (result.verdict_label ? '「' + result.verdict_label + '」　' : '') + (result.summary || '');

    const flagsList = document.getElementById('flagsList');
    flagsList.innerHTML = '';
    const flags = Array.isArray(result.flags) ? result.flags : [];
    if(flags.length === 0){
      flagsList.innerHTML = '<li class="flag" style="border-left-color:var(--good);background:rgba(84,112,79,0.06);"><div class="flag-note">気になる表現は見つかりませんでした。</div></li>';
    } else {
      flags.forEach(f => {
        const li = document.createElement('li');
        li.className = 'flag' + (f.type === 'stiff' ? ' type-stiff' : '');
        li.innerHTML = `
          <div class="flag-phrase">${escapeHtml(f.phrase || '')}</div>
          <div class="flag-note">${escapeHtml(f.note || '')}</div>
          ${f.suggestion ? `<div class="flag-suggestion"><b>言い換え → </b>${escapeHtml(f.suggestion)}</div>` : ''}
        `;
        flagsList.appendChild(li);
      });
    }

    document.getElementById('improvedBox').textContent = result.improved_email || '(生成できませんでした)';
    resultTag.textContent = (result.score ?? '') + '/100';

    setState('result');
  }catch(err){
    console.error(err);
    errorBox.textContent = '判定に失敗しました。もう一度お試しください。（' + err.message + '）';
    setState('error');
  }finally{
    checkBtn.disabled = false;
  }
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const txt = document.getElementById('improvedBox').textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById('copyBtn');
    const orig = btn.textContent;
    btn.textContent = 'コピーしました';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
});

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
